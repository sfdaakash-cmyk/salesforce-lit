[project]
name = "salesforce-lit"
version = "0.1.0"
description = "Python-native Salesforce release notes assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "gradio>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
